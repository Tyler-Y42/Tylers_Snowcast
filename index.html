<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyler's Snowcast</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 30px 20px 130px; /* bottom clearance for fixed master bar */
            color: #fff;
        }
        .container { max-width: 1500px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            align-items: start;
        }
        .group { display: flex; flex-direction: column; gap: 14px; }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px 32px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        .master-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 10px 28px;
            padding: 12px 20px;
            background: rgba(20, 25, 55, 0.88);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(116,235,213,0.35);
        }
        .master-bar .master-title { font-weight: 700; color: #74ebd5; letter-spacing: 1px; font-size: 0.95rem; white-space: nowrap; }
        .master-info { display: flex; align-items: center; gap: 12px; }
        .master-slider-wrap { display: flex; flex-direction: column; gap: 5px; flex: 1 1 280px; max-width: 520px; }
        .master-bar input[type="range"] { width: 100%; height: 12px; border-radius: 6px; }
        .master-bar input[type="range"]::-webkit-slider-thumb { width: 30px; height: 30px; }
        .master-bar input[type="range"]::-moz-range-thumb { width: 30px; height: 30px; }
        .master-bar .slider-ticks { margin-top: 2px; font-size: 0.7rem; color: rgba(255,255,255,0.55); }
        .master-bar .days-badge { white-space: nowrap; background: rgba(116,235,213,0.25); }
        .master-bar .cutoff-date {
            margin-top: 0; white-space: nowrap;
            font-style: normal; font-weight: 700; font-size: 1rem;
            color: #74ebd5; text-shadow: 0 0 12px rgba(116,235,213,0.35);
        }
        .master-bar .mode-toggle { margin-top: 0; }
        .mode-hint { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 6px; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
        }
        .location-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .location-emoji { font-size: 1.2rem; }
        .temp-section { text-align: right; }
        .current-temp {
            font-size: 1.5rem;
            font-weight: 600;
            color: #74ebd5;
            cursor: help;
        }
        .wind-speed { font-size: 0.75rem; color: rgba(255,255,255,0.6); }

        .group-header {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 6px;
        }
        
        .snow-amount {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .snow-amount.loading { background: none; -webkit-text-fill-color: rgba(255,255,255,0.4); font-size: 1rem; font-weight: 400; }
        .snow-amount.error { background: none; -webkit-text-fill-color: #ff6b6b; font-size: 0.85rem; font-weight: 400; }
        .snow-amount.none { background: none; -webkit-text-fill-color: rgba(255,255,255,0.5); font-size: 1rem; font-weight: 400; }
        
        .mode-toggle { display: flex; align-items: center; gap: 10px; margin-top: 26px; }
        .mode-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        .mode-label.active { color: #74ebd5; font-weight: 600; }
        .toggle-switch {
            position: relative; width: 40px; height: 22px;
            background: rgba(255,255,255,0.2); border-radius: 11px;
            cursor: pointer; transition: background 0.3s ease;
        }
        .toggle-switch.on { background: #4ade80; }
        .toggle-switch::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 16px; height: 16px; background: #fff;
            border-radius: 50%; transition: transform 0.3s ease;
        }
        .toggle-switch.on::after { transform: translateX(18px); }
        
        .days-badge {
            background: rgba(255,255,255,0.15); padding: 3px 10px;
            border-radius: 12px; font-weight: 600; font-size: 0.8rem; color: #fff;
        }
        input[type="range"] {
            width: 100%; height: 5px; border-radius: 3px;
            background: rgba(255,255,255,0.2); outline: none;
            -webkit-appearance: none; appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            cursor: pointer; box-shadow: 0 2px 8px rgba(116, 235, 213, 0.4);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            cursor: pointer; border: none;
        }
        .slider-ticks { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.65rem; color: rgba(255,255,255,0.4); }
        .cutoff-date { margin-top: 8px; font-size: 0.75rem; color: rgba(255,255,255,0.5); text-align: center; font-style: italic; }
        
        footer { text-align: center; margin-top: 40px; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
        footer a:hover { color: #74ebd5; }
        
        /* Desktop: grid fills the viewport so the two card rows always span the screen */
        @media (min-width: 900px) {
            html, body { height: 100%; }
            body { padding-bottom: 110px; }
            .container { min-height: 100%; display: flex; flex-direction: column; }
            .cards-grid { flex: 1; min-height: 0; align-items: stretch; }
            .group > .card { flex: 1; }
            footer { margin-top: 16px; }
        }

        @media (max-width: 600px) {
            body { padding: 24px 14px 190px; } /* taller clearance: master bar wraps on phones */
            h1 { font-size: 1.75rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .master-bar { gap: 8px 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>❄️ Snow Accumulation Forecast ❄️</h1>
        </header>
        <div class="cards-grid" id="cardsContainer"></div>
        <footer>
            <p>Snow data from <a href="https://www.weather.gov" target="_blank">api.weather.gov</a> · Temperature from <a href="https://mesowest.utah.edu" target="_blank">MesoWest</a></p>
            <p class="mode-hint">Point = NWS Gridpoint Model Total&nbsp; | &nbsp;Range = min-max scraped from text forecast</p>
        </footer>
    </div>

    <script>
        // Locations with nearest MesoWest station IDs, grouped by area, higher elevation first
        const groupOrder = ['LCC', 'BCC', 'SLC', 'Uintas', 'Misc'];
        const locations = [
            // Little Cottonwood Canyon
            { name: 'Alta Peak', group: 'LCC', lat: 40.5677, lon: -111.6374, emoji: '🗻', stid: ['AMB'] }, // Mt Baldy
            { name: 'Alta Base', group: 'LCC', lat: 40.5884, lon: -111.6386, emoji: '🏔️', stid: ['ATB'] },
            // Big Cottonwood Canyon
            { name: 'Brighton Peak', group: 'BCC', lat: 40.5923, lon: -111.5616, emoji: '🗻', stid: ['BRW'] }, // Great Western
            { name: 'Spruces', group: 'BCC', lat: 40.6555, lon: -111.6302, emoji: '🌲', stid: ['SPC'] },
            // Salt Lake City
            { name: 'SLC East Bench', group: 'SLC', lat: 40.7287, lon: -111.8168, emoji: '🏠', stid: ['E6393'] },
            { name: 'U of U', group: 'SLC', lat: 40.7666, lon: -111.8479, emoji: '🏫', stid: ['WBB'] },
            // Uintas
            { name: 'High Uintas', group: 'Uintas', lat: 40.7179, lon: -110.4672, emoji: '⛰️', stid: ['FPLU1'] }, // Five Points Lake SNOTEL (no wind sensor)
            { name: 'Low Uintas', group: 'Uintas', lat: 40.626, lon: -111.187, emoji: '🦫', stid: ['PC354', 'NWRU1'] }, // average
            // Misc
            { name: 'Donner Pass', group: 'Misc', lat: 39.4290, lon: -120.2680, emoji: '🦃', stid: ['SGHEN'] }, // Sagehen Creek mid-elevation
            { name: 'Little Dell', group: 'Misc', lat: 40.7735, lon: -111.6937, emoji: '💧', stid: ['PC410'] }
        ];

        const forecastData = {};
        const modeState = {};
        let globalDays = 3;
        let globalMode = false; // false = Point Estimate

        function createMasterBar() {
            return `
                <div class="master-bar">
                    <div class="master-info">
                        <span class="master-title">⏱️ Forecast Period</span>
                        <span class="days-badge" id="masterDaysLabel">+3 days</span>
                        <span class="cutoff-date" id="masterCutoff"></span>
                    </div>
                    <div class="master-slider-wrap">
                        <input type="range" id="masterSlider" min="0" max="6" value="3" oninput="applyMasterDays()">
                        <div class="slider-ticks">
                            <span>Today</span><span>+1</span><span>+2</span><span>+3</span><span>+4</span><span>+5</span><span>+6</span>
                        </div>
                    </div>
                    <div class="mode-toggle">
                        <span class="mode-label active" id="masterLabelPoint">Point Estimate</span>
                        <div class="toggle-switch" id="masterToggle" onclick="applyMasterMode()"></div>
                        <span class="mode-label" id="masterLabelRange">Range</span>
                    </div>
                </div>
            `;
        }

        function createCardHTML(location) {
            const safeId = location.name.replace(/[^a-zA-Z]/g, '');
            modeState[safeId] = false;
            return `
                <div class="card" id="card-${safeId}">
                    <div class="card-header">
                        <span class="location-name">
                            <span class="location-emoji">${location.emoji}</span>
                            ${location.name}
                        </span>
                        <div class="temp-section">
                            <div class="current-temp" id="temp-${safeId}" title="Loading...">--°F</div>
                            <div class="wind-speed" id="wind-${safeId}">-- mph</div>
                        </div>
                    </div>
                    <div class="snow-amount loading" id="amount-${safeId}">Loading...</div>
                    <div class="mode-toggle">
                        <span class="mode-label active" id="label-point-${safeId}">Point Estimate</span>
                        <div class="toggle-switch" id="toggle-${safeId}" onclick="toggleMode('${safeId}')"></div>
                        <span class="mode-label" id="label-range-${safeId}">Range</span>
                    </div>
                </div>
            `;
        }

        function toggleMode(safeId) {
            modeState[safeId] = !modeState[safeId];
            const toggle = document.getElementById(`toggle-${safeId}`);
            const labelPoint = document.getElementById(`label-point-${safeId}`);
            const labelRange = document.getElementById(`label-range-${safeId}`);
            toggle.classList.toggle('on', modeState[safeId]);
            labelRange.classList.toggle('active', modeState[safeId]);
            labelPoint.classList.toggle('active', !modeState[safeId]);
            updateForecast(safeId);
        }

        function applyMasterMode() {
            globalMode = !globalMode;
            const toggle = document.getElementById('masterToggle');
            const labelPoint = document.getElementById('masterLabelPoint');
            const labelRange = document.getElementById('masterLabelRange');
            toggle.classList.toggle('on', globalMode);
            labelRange.classList.toggle('active', globalMode);
            labelPoint.classList.toggle('active', !globalMode);
            
            // Auto-apply to all locations
            locations.forEach(loc => {
                const safeId = loc.name.replace(/[^a-zA-Z]/g, '');
                modeState[safeId] = globalMode;
                const locToggle = document.getElementById(`toggle-${safeId}`);
                const locLabelPoint = document.getElementById(`label-point-${safeId}`);
                const locLabelRange = document.getElementById(`label-range-${safeId}`);
                if (locToggle) {
                    locToggle.classList.toggle('on', globalMode);
                    locLabelRange.classList.toggle('active', globalMode);
                    locLabelPoint.classList.toggle('active', !globalMode);
                    updateForecast(safeId);
                }
            });
        }

        function applyMasterDays() {
            globalDays = parseInt(document.getElementById('masterSlider').value);
            const label = document.getElementById('masterDaysLabel');
            const cutoffEl = document.getElementById('masterCutoff');
            label.textContent = globalDays === 0 ? 'Today' : `+${globalDays} day${globalDays > 1 ? 's' : ''}`;
            cutoffEl.textContent = `Until ${formatCutoffDate(getCutoffDate(globalDays))}`;
            
            // Auto-apply to all locations
            locations.forEach(loc => {
                const safeId = loc.name.replace(/[^a-zA-Z]/g, '');
                if (document.getElementById(`card-${safeId}`)) updateForecast(safeId);
            });
        }

        async function fetchMesoWestTemp(stids) {
            // Handle array of station IDs (for averaging)
            const stidList = Array.isArray(stids) ? stids : [stids];
            const temps = [];
            const winds = [];
            const stationNames = [];

            const token = 'c651d1e209fa4443a42eeef956180701';

            for (const stid of stidList) {
                // Timeseries over the last 6h so slow reporters (hourly SNOTELs) still yield 3 wind obs
                const apiUrl = `https://api.synopticdata.com/v2/stations/timeseries?stid=${stid}&recent=360&vars=air_temp,wind_speed&units=english&token=${token}`;

                // Synoptic occasionally returns truncated JSON — retry a couple times
                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        const response = await fetch(apiUrl);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();
                        if (data.STATION && data.STATION.length > 0) {
                            const station = data.STATION[0];
                            const obs = station.OBSERVATIONS || {};
                            const tempSeries = (obs.air_temp_set_1 || []).filter(v => v !== null && v !== undefined);
                            if (tempSeries.length > 0) {
                                temps.push(tempSeries[tempSeries.length - 1]); // most recent temp
                                stationNames.push(station.STID || stid);
                            }
                            const windSeries = (obs.wind_speed_set_1 || []).filter(v => v !== null && v !== undefined);
                            if (windSeries.length > 0) {
                                const last3 = windSeries.slice(-3); // average of 3 most recent obs
                                winds.push(last3.reduce((a, b) => a + b, 0) / last3.length);
                            }
                        }
                        break;
                    } catch (e) {
                        if (attempt === 3) console.warn(`MesoWest fetch failed for ${stid}:`, e);
                        else await new Promise(r => setTimeout(r, 500 * attempt));
                    }
                }
            }

            if (temps.length > 0) {
                const avgTemp = temps.reduce((a, b) => a + b, 0) / temps.length;
                return {
                    temp: Math.round(avgTemp),
                    wind: winds.length > 0 ? Math.round(winds.reduce((a, b) => a + b, 0) / winds.length) : null,
                    stationIds: stationNames,
                    stationName: stationNames.join(' & ')
                };
            }
            return null;
        }

        async function fetchSnowfallData(location) {
            const pointsUrl = `https://api.weather.gov/points/${location.lat},${location.lon}`;
            const pointsResponse = await fetch(pointsUrl, { headers: { 'User-Agent': 'SnowForecast' } });
            if (!pointsResponse.ok) throw new Error(`Grid error: ${pointsResponse.status}`);
            
            const pointsData = await pointsResponse.json();
            const { gridId, gridX, gridY } = pointsData.properties;
            const forecastUrl = pointsData.properties.forecast;
            
            const gridUrl = `https://api.weather.gov/gridpoints/${gridId}/${gridX},${gridY}`;
            const gridResponse = await fetch(gridUrl, { headers: { 'User-Agent': 'SnowForecast' } });
            if (!gridResponse.ok) throw new Error(`Gridpoint error: ${gridResponse.status}`);
            const gridData = await gridResponse.json();
            
            let textPeriods = [];
            try {
                const textResponse = await fetch(forecastUrl, { headers: { 'User-Agent': 'SnowForecast' } });
                if (textResponse.ok) {
                    const textData = await textResponse.json();
                    textPeriods = textData.properties.periods || [];
                }
            } catch (e) {}
            
            // Fetch temp from MesoWest
            const mesoResult = await fetchMesoWestTemp(location.stid);
            
            return {
                quantitative: gridData.properties.snowfallAmount?.values || [],
                uom: gridData.properties.snowfallAmount?.uom || 'wmoUnit:mm',
                textPeriods,
                currentTemp: mesoResult?.temp ?? null,
                currentWind: mesoResult?.wind ?? null,
                stationName: mesoResult?.stationName || null,
                stationIds: mesoResult?.stationIds || []
            };
        }

        function getCutoffDate(days) {
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() + days);
            cutoff.setHours(23, 59, 59, 999);
            return cutoff;
        }

        function formatCutoffDate(cutoff) {
            return cutoff.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ' 11:59 PM';
        }

        function parseISODuration(duration) {
            // Handles NWS durations like PT6H, P1D, P1DT6H, PT30M
            const [datePart, timePart] = duration.split('T');
            let ms = 0;
            const days = datePart.match(/(\d+)D/);
            if (days) ms += +days[1] * 86400000;
            if (timePart) {
                const h = timePart.match(/(\d+)H/);
                const m = timePart.match(/(\d+)M/);
                if (h) ms += +h[1] * 3600000;
                if (m) ms += +m[1] * 60000;
            }
            return ms || 3600000;
        }

        function parseValidTime(validTime) {
            const [dateStr, duration] = validTime.split('/');
            const start = new Date(dateStr);
            const ms = duration ? parseISODuration(duration) : 3600000;
            return { start, end: new Date(start.getTime() + ms) };
        }

        function extractTextRanges(textPeriods, cutoff) {
            let min = 0, max = 0, found = false;
            textPeriods.forEach(p => {
                if (new Date(p.startTime) > cutoff) return;
                const d = p.detailedForecast;
                (d.match(/(\d+)\s*to\s*(\d+)\s*inch/gi) || []).forEach(m => {
                    const n = m.match(/(\d+)\s*to\s*(\d+)/);
                    if (n) { min += +n[1]; max += +n[2]; found = true; }
                });
                (d.match(/(?:around|about|near)\s+(\d+)\s*inch/gi) || []).forEach(m => {
                    const v = +m.match(/(\d+)/)[1];
                    min += v; max += v; found = true;
                });
                (d.match(/less than (?:a |one |(\d+)\s*)inch/gi) || []).forEach(() => { max += 1; found = true; });
                (d.match(/up to (\d+)\s*inch/gi) || []).forEach(m => {
                    max += +m.match(/(\d+)/)[1]; found = true;
                });
                (d.match(/(?:a |one )half (?:an )?inch|half an inch/gi) || []).forEach(() => { max += 0.5; found = true; });
            });
            return { min, max, found };
        }

        function toInches(value, uom) {
            if (/:in/.test(uom)) return value;
            if (/:cm/.test(uom)) return value / 2.54;
            return value / 25.4; // wmoUnit:mm (NWS default)
        }

        function calculateSnowfall(data, days, useRange) {
            const cutoff = getCutoffDate(days);
            const now = new Date();
            let total = 0;

            (data.quantitative || []).forEach(item => {
                if (item.value === null) return;
                const { start, end } = parseValidTime(item.validTime);
                // Pro-rate blocks partially outside [now, cutoff] to the overlapping fraction
                const overlapStart = Math.max(start.getTime(), now.getTime());
                const overlapEnd = Math.min(end.getTime(), cutoff.getTime());
                if (overlapEnd <= overlapStart) return;
                total += item.value * (overlapEnd - overlapStart) / (end.getTime() - start.getTime());
            });

            const inches = Math.round(toInches(total, data.uom) * 10) / 10;
            
            if (useRange) {
                const { min, max, found } = extractTextRanges(data.textPeriods, cutoff);
                if (found && max > 0) return { min, max, isPoint: false };
            }
            return { min: inches, max: inches, isPoint: true };
        }

        function updateForecast(safeId) {
            const amountEl = document.getElementById(`amount-${safeId}`);

            if (!forecastData[safeId]) return;

            const { min, max, isPoint } = calculateSnowfall(forecastData[safeId], globalDays, modeState[safeId]);
            
            if (min === 0 && max === 0) {
                amountEl.className = 'snow-amount none';
                amountEl.textContent = 'No snow forecast';
            } else {
                amountEl.className = 'snow-amount';
                amountEl.textContent = isPoint || min === max ? `${max}"` : `${min}–${max}"`;
            }
        }

        async function initializeCards() {
            const container = document.getElementById('cardsContainer');
            let html = '';
            groupOrder.forEach(group => {
                const groupLocs = locations.filter(loc => loc.group === group);
                if (groupLocs.length === 0) return;
                html += `<section class="group"><div class="group-header">${group}</div>${groupLocs.map(createCardHTML).join('')}</section>`;
            });
            container.innerHTML = html;
            document.body.insertAdjacentHTML('beforeend', createMasterBar());

            // Init master slider display
            applyMasterDays();

            loadAllData();
            setInterval(loadAllData, 10 * 60 * 1000); // refresh every 10 minutes
        }

        async function loadAllData() {
            await Promise.all(locations.map(loadLocation));
        }

        async function loadLocation(loc) {
            const safeId = loc.name.replace(/[^a-zA-Z]/g, '');
            const amountEl = document.getElementById(`amount-${safeId}`);
            const tempEl = document.getElementById(`temp-${safeId}`);
            const windEl = document.getElementById(`wind-${safeId}`);

            try {
                const data = await fetchSnowfallData(loc);
                forecastData[safeId] = data;

                if (data.currentTemp !== null) {
                    tempEl.textContent = `${data.currentTemp}°F`;
                    tempEl.title = `MesoWest: ${data.stationName}`;
                    tempEl.style.cursor = 'pointer';
                    tempEl.onclick = () => {
                        const firstStation = data.stationIds[0];
                        window.open(`https://mesowest.utah.edu/cgi-bin/droman/meso_base_dyn.cgi?stn=${firstStation}`, '_blank');
                    };
                } else {
                    tempEl.textContent = '--°F';
                    tempEl.title = 'Temperature unavailable';
                }

                if (data.currentWind !== null) {
                    windEl.textContent = `${data.currentWind} mph`;
                }

                updateForecast(safeId);
            } catch (error) {
                amountEl.className = 'snow-amount error';
                amountEl.textContent = `Error: ${error.message}`;
            }
        }

        window.onload = initializeCards;
    </script>
</body>
</html>
